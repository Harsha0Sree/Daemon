services:
  postgres:
    image: postgres:16

    container_name: postgres_db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
  
  app:
    build: .

    ports:
      - "8000:8000"
    depends_on:
      - postgres
volumes :
  postgres_data :